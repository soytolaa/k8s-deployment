apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: spring-route

spec:
  parentRefs:
    - name: traefik-gateway

  hostnames:
    - api.soytola.site

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: spring-app
          port: 8080